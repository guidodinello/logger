# Baseline CI for a small/single-package Python repo. Runs only the ruff
# format/lint hooks from .pre-commit-config.yaml as a required gate, since
# pre-commit itself only runs locally and CI is the only place a required
# check can actually enforce anything — the other hooks in that config
# (trailing-whitespace, check-yaml, pyupgrade, etc.) are enforced nowhere
# in CI.
#
# Lint only, no test job: this repo has no tests/ dir and no pytest in its
# dev dependency group. Add a "Tests (Python)" job once that changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    # Runner pool is switchable per repo without editing this file: set the
    # CI_RUNNERS repo variable to a JSON array of runner labels — e.g.
    # ["self-hosted","linux","x64"] — to route CI off GitHub-hosted runners
    # when their minutes are unavailable (on a private repo, exhausting the
    # free tier makes every job refuse to start). Unset means ubuntu-latest.
    # See dev-standards' README § CI runners for the commands.
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

  # Single stable check name for the branch ruleset (see dev-standards
  # templates/ci/python-ci.yml). if: always() so it still runs (and fails) when a
  # needed job fails; a skipped required check would count as passing.
  ci:
    name: CI
    needs:
      - lint-python
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -ra results <<< "$RESULTS"
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "A required job finished as: $r"
              exit 1
            fi
          done
