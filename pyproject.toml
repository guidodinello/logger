[project]
name = "logger"
version = "0.1.0"
description = "Minimal stdlib logging setup — stdout + rotating file, one init call"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logger"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=9",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's logging plugin puts capture handlers on the root logger during each
# test, which makes init_logging a no-op; these tests need a bare root logger.
addopts = ["-p", "no:logging"]
